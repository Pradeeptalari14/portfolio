name: Keepalive Workflow

on:
  schedule:
    - cron: '0 0 1,15 * *' # Run twice a month to prevent 60-day inactivity timeout
  workflow_dispatch:

jobs:
  keepalive:
    name: Prevent Scheduled Workflow Disabling
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: GitHub Actions Keepalive
        uses: gautamkrishnar/keepalive-workflow@121d51a660a5e8eeab9be61a9fb016c5a932d0f5 # v2.0.7
