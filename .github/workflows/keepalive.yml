name: Keepalive Workflow

on:
  schedule:
    - cron: '0 0 1,15 * *' # Run twice a month to prevent 60-day inactivity timeout
  workflow_dispatch:

jobs:
  keepalive:
    name: Prevent Scheduled Workflow Disabling
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: GitHub Actions Keepalive
        uses: liskin/gh-workflow-keepalive@v1
