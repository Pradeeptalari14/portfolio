<svg width="854" height="230" viewBox="0 0 854 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.6" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Pill Gradient -->
    <linearGradient id="pill-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="tech-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
    </pattern>

    <style>
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
      }
      .beacon-dot {
        animation: pulseDot 2s infinite ease-in-out;
        transform-origin: 712px 22px;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .body-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      .mono-text {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      }
    </style>
  </defs>

  <!-- Card Background -->
  <rect x="2" y="2" width="850" height="226" rx="14" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="1.5" />
  <rect x="2" y="2" width="850" height="226" rx="14" fill="url(#tech-grid)" />

  <!-- Top Terminal Bar -->
  <line x1="2" y1="42" x2="852" y2="42" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
  
  <!-- Terminal Dots -->
  <circle cx="24" cy="22" r="5" fill="#ef4444" />
  <circle cx="40" cy="22" r="5" fill="#f59e0b" />
  <circle cx="56" cy="22" r="5" fill="#10b981" />

  <!-- Terminal Prompt -->
  <text x="76" y="26" class="mono-text" font-size="11" fill="#64748b">pradeep@platform-core:~ (zsh)</text>

  <!-- Live Status Beacon -->
  <g class="beacon-dot">
    <circle cx="712" cy="22" r="4.5" fill="#10b981" />
    <circle cx="712" cy="22" r="8" fill="#10b981" opacity="0.25" />
  </g>
  <text x="726" y="26" class="mono-text" font-size="10" font-weight="600" fill="#34d399">OPEN TO ROLES</text>

  <!-- Main Hero Title -->
  <text x="427" y="94" text-anchor="middle" class="title-text" font-size="38" fill="url(#title-grad)">PRADEEP TALARI</text>

  <!-- Role Subtitle -->
  <text x="427" y="124" text-anchor="middle" class="body-text" font-size="16" font-weight="600" fill="#f8fafc">Senior AI Infrastructure, Platform &amp; Cloud SRE Lead</text>

  <!-- Tech Highlights Subtitle -->
  <text x="427" y="148" text-anchor="middle" class="body-text" font-size="12" fill="#94a3b8">Autonomous Multi-Agent Graphs · LLMOps &amp; vLLM · Multi-Cloud Kubernetes · GitOps Automation</text>

  <!-- Bottom Pills Container -->
  <!-- Pill 1: LLMOps -->
  <g transform="translate(42, 172)">
    <rect width="138" height="34" rx="8" fill="url(#pill-grad)" stroke="rgba(99, 102, 241, 0.3)" stroke-width="1" />
    <text x="69" y="21" text-anchor="middle" class="body-text" font-size="11" font-weight="600" fill="#a5b4fc">🧠 LLMOps &amp; vLLM</text>
  </g>

  <!-- Pill 2: Kubernetes -->
  <g transform="translate(196, 172)">
    <rect width="144" height="34" rx="8" fill="url(#pill-grad)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
    <text x="72" y="21" text-anchor="middle" class="body-text" font-size="11" font-weight="600" fill="#7dd3fc">☸️ EKS &amp; Karpenter</text>
  </g>

  <!-- Pill 3: Terraform -->
  <g transform="translate(356, 172)">
    <rect width="144" height="34" rx="8" fill="url(#pill-grad)" stroke="rgba(192, 132, 252, 0.3)" stroke-width="1" />
    <text x="72" y="21" text-anchor="middle" class="body-text" font-size="11" font-weight="600" fill="#d8b4fe">🏗️ Terraform &amp; IaC</text>
  </g>

  <!-- Pill 4: SRE Reliability -->
  <g transform="translate(516, 172)">
    <rect width="140" height="34" rx="8" fill="url(#pill-grad)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
    <text x="70" y="21" text-anchor="middle" class="body-text" font-size="11" font-weight="600" fill="#6ee7b7">📊 99.99% Reliability</text>
  </g>

  <!-- Pill 5: Studios -->
  <g transform="translate(672, 172)">
    <rect width="140" height="34" rx="8" fill="url(#pill-grad)" stroke="rgba(244, 63, 94, 0.3)" stroke-width="1" />
    <text x="70" y="21" text-anchor="middle" class="body-text" font-size="11" font-weight="600" fill="#fda4af">🚀 291 Live Studios</text>
  </g>
</svg>
