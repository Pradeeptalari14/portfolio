version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: studios_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studios_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-studios_hub}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    container_name: studios_valkey
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - valkeydata:/data
    command: valkey-server --save 60 1 --loglevel notice

  ollama:
    image: ollama/ollama:latest
    container_name: studios_ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollamadata:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: studios_api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-studios_dev_pass}@postgres:5432/${POSTGRES_DB:-studios_hub}
      - OLLAMA_HOST=http://ollama:11434
      - VALKEY_HOST=valkey:6379
      - EMBEDDING_DIM=768
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  valkeydata:
  ollamadata:
